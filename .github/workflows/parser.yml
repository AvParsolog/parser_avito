name: Avito Parser — Continuous Runner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source (internal)'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read
  actions: write

# chain-раны (self-renew) отменяют всё в группе, в т.ч. зависшие scheduled.
# scheduled/manual — стоят в очереди, но вытесняются, когда стартует chain.
concurrency:
  group: avito-parser
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source == 'chain' }}

jobs:
  parse-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state (database + storage) from previous runs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/database.db
            storage/
          key: ${{ runner.os }}-parser-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-parser-state-

      - name: Prepare working directories
        run: |
          mkdir -p data result storage
          [ -f data/database.db ] || touch data/database.db

      - name: Write config.toml from base64 secret
        env:
          CONFIG_TOML_B64: ${{ secrets.CONFIG_TOML_B64 }}
        run: |
          if [ -z "$CONFIG_TOML_B64" ]; then
            echo "❌ Секрет CONFIG_TOML_B64 не задан!"
            exit 1
          fi

          printf '%s' "$CONFIG_TOML_B64" | base64 -d > data/config.toml

          if [ ! -s data/config.toml ]; then
            echo "❌ config.toml пустой после декодирования!"
            exit 1
          fi

          if ! grep -q '^\[avito\]' data/config.toml; then
            echo "❌ В config.toml нет секции [avito]!"
            exit 1
          fi

          echo "✅ config.toml декодирован: $(wc -l < data/config.toml) строк, $(wc -c < data/config.toml) байт"

      - name: Sanitize config for current image
        run: |
          cat > data/sanitize.py <<'PYEOF'
          import tomllib, tomli_w, dataclasses, dto

          path = "config.toml"
          with open(path, "rb") as f:
              data = tomllib.load(f)

          valid = {f.name for f in dataclasses.fields(dto.AvitoConfig)}
          avito = data.get("avito", {})
          removed = [k for k in list(avito.keys()) if k not in valid]
          for k in removed:
              del avito[k]

          with open(path, "wb") as f:
              tomli_w.dump(data, f)

          print(f"🧹 Удалено полей, неизвестных образу: {removed if removed else '(нет)'}")
          print(f"✅ Осталось полей: {len(avito)}")
          PYEOF

          docker run --rm \
            -v "$PWD/data/config.toml:/app/config.toml" \
            -v "$PWD/data/sanitize.py:/app/sanitize.py:ro" \
            --entrypoint python \
            ghcr.io/duff89/parser_avito:latest /app/sanitize.py

      - name: Run parser loop (5.5 hours)
        run: |
          set -u
          END_TIME=$(( $(date +%s) + 19800 ))    # 5.5 часов
          CYCLE_INTERVAL=300                     # 5 минут между циклами
          PARSER_MAX_RUNTIME=270                 # максимум 4.5 мин на один проход

          CYCLE=0
          while [ $(date +%s) -lt $END_TIME ]; do
            CYCLE=$(( CYCLE + 1 ))
            CYCLE_START=$(date +%s)
            CONTAINER_NAME="avito_parser_${GITHUB_RUN_ID}_${CYCLE}"

            echo "═══════════════════════════════════════════════════"
            echo "▶ Цикл #${CYCLE} стартовал: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "═══════════════════════════════════════════════════"

            timeout --signal=SIGTERM --kill-after=15 $PARSER_MAX_RUNTIME \
              docker run --rm \
                --name "$CONTAINER_NAME" \
                -v "$PWD/data/config.toml:/app/config.toml:ro" \
                -v "$PWD/data/database.db:/app/database.db" \
                -v "$PWD/storage:/app/storage" \
                -v "$PWD/result:/app/result" \
                ghcr.io/duff89/parser_avito:latest \
              || echo "⚠️ Проход завершился с кодом $? — продолжаю"

            docker kill "$CONTAINER_NAME" 2>/dev/null || true

            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            WAIT=$(( CYCLE_INTERVAL - ELAPSED ))
            if [ $WAIT -gt 0 ]; then
              echo "⏱ Проход занял ${ELAPSED}с, пауза ${WAIT}с"
              sleep $WAIT
            else
              echo "⚠️ Проход занял больше ${CYCLE_INTERVAL}с — иду сразу на следующий"
            fi
          done
          echo "✅ Истекли 5.5 часа, выходим из цикла"

      - name: List results
        if: always()
        run: |
          echo "════ Содержимое result/ ════"
          ls -la result/ || echo "(папка пуста)"

      - name: Upload Excel results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-results-${{ github.run_id }}
          path: result/
          if-no-files-found: ignore
          retention-days: 7

      - name: Send results to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e

          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "⚠️ TG_BOT_TOKEN или TG_CHAT_ID не заданы — пропускаю отправку"
            exit 0
          fi

          shopt -s nullglob
          files=(result/*.xlsx result/*.csv result/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ В result/ нет файлов — отправлять нечего"
            exit 0
          fi

          if [ ${#files[@]} -eq 1 ]; then
            SEND_FILE="${files[0]}"
          else
            SEND_FILE="avito_results_${RUN_ID}.zip"
            zip -j -q "$SEND_FILE" "${files[@]}"
          fi

          SIZE_BYTES=$(stat -c%s "$SEND_FILE")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          CAPTION="📊 Avito Parser — результаты run ${RUN_ID} | файлов: ${#files[@]} | размер: ${SIZE_MB} MB"

          echo "📤 Отправляю ${SEND_FILE} (${SIZE_BYTES} байт)"
          echo "   chat_id: ${TG_CHAT_ID}"
          echo "   caption: ${CAPTION}"

          # Несколько chat_id через запятую
          IFS=',' read -ra CHATS <<< "$TG_CHAT_ID"
          ALL_OK=0
          for CHAT in "${CHATS[@]}"; do
            CHAT="$(echo "$CHAT" | xargs)"
            [ -z "$CHAT" ] && continue
            echo "→ chat_id=${CHAT}"
            HTTP_CODE=$(curl -sS -o /tmp/tg_resp.json -w '%{http_code}' \
              -F "chat_id=${CHAT}" \
              -F "caption=${CAPTION}" \
              -F "document=@${SEND_FILE}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "   ✅ отправлено"
            else
              echo "   ❌ ошибка HTTP ${HTTP_CODE}:"
              cat /tmp/tg_resp.json || true
              ALL_OK=1
            fi
          done

          # Не валим job, даже если TG не принял — workflow важнее
          exit 0

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/database.db
            storage/
          key: ${{ runner.os }}-parser-state-${{ github.run_id }}

      - name: 🔄 Self-renew — запускаю следующий workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Запускаю следующую итерацию (chain)..."
          gh workflow run parser.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f source=chain
