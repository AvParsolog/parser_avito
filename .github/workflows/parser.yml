name: Avito Parser — Continuous Runner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source (internal)'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: avito-parser
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source == 'chain' }}

jobs:
  parse-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state (database + storage) from previous runs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/database.db
            storage/
            data/working_servers.json
            data/current_server_idx
          key: ${{ runner.os }}-parser-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-parser-state-

      - name: Prepare working directories
        run: |
          mkdir -p data result storage
          [ -f data/database.db ] || touch data/database.db

      - name: Write config.toml from base64 secret
        env:
          CONFIG_TOML_B64: ${{ secrets.CONFIG_TOML_B64 }}
        run: |
          if [ -z "$CONFIG_TOML_B64" ]; then
            echo "❌ Секрет CONFIG_TOML_B64 не задан!"
            exit 1
          fi
          printf '%s' "$CONFIG_TOML_B64" | base64 -d > data/config.toml
          if [ ! -s data/config.toml ]; then
            echo "❌ config.toml пустой!"
            exit 1
          fi
          if ! grep -q '^\[avito\]' data/config.toml; then
            echo "❌ В config.toml нет секции [avito]!"
            exit 1
          fi
          echo "✅ config.toml декодирован"

      - name: Sanitize config for current image
        run: |
          cat > data/sanitize.py <<'PYEOF'
          import tomllib, tomli_w, dataclasses, dto
          with open("config.toml", "rb") as f:
              data = tomllib.load(f)
          valid = {f.name for f in dataclasses.fields(dto.AvitoConfig)}
          avito = data.get("avito", {})
          removed = [k for k in list(avito.keys()) if k not in valid]
          for k in removed:
              del avito[k]
          with open("config.toml", "wb") as f:
              tomli_w.dump(data, f)
          print(f"🧹 Удалено полей: {removed if removed else '(нет)'}")
          PYEOF
          docker run --rm \
            -v "$PWD/data/config.toml:/app/config.toml" \
            -v "$PWD/data/sanitize.py:/app/sanitize.py:ro" \
            --entrypoint python \
            ghcr.io/avparsolog/parser_avito:latest /app/sanitize.py

      - name: Setup Xray
        run: |
          set -e
          echo "⬇️ Скачиваю Xray-core..."
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray_bin
          unzip -q /tmp/xray.zip -d xray_bin
          chmod +x xray_bin/xray
          ./xray_bin/xray version | head -n1

      - name: Build working servers list (test all sources)
        run: |
          set -e
          python3 data/pick_vless.py build 2>&1 | tee data/build_log.txt

      - name: Start Xray with first working server
        run: |
          set -e
          python3 data/pick_vless.py pick

          nohup ./xray_bin/xray -c data/xray_config.json > data/xray.log 2>&1 &
          echo $! > data/xray.pid
          echo "Xray PID: $(cat data/xray.pid)"

          for i in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/1080) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "✅ Xray слушает на 127.0.0.1:1080 (после ${i}с)"
              echo "🌐 Внешний IP через прокси:"
              curl -s --max-time 15 -x http://127.0.0.1:1080 https://api.ipify.org || echo "(не удалось)"
              echo ""
              exit 0
            fi
            sleep 1
          done
          echo "❌ Xray не поднялся"
          cat data/xray.log || true
          exit 1

      - name: Patch config with local xray proxy
        run: |
          pip install --quiet tomli_w
          python3 - <<'PYEOF'
          import tomllib, tomli_w
          with open("data/config.toml", "rb") as f:
              data = tomllib.load(f)
          data.setdefault("avito", {})
          data["avito"]["proxy_string"] = "127.0.0.1:1080"
          data["avito"]["proxy_change_url"] = ""
          data["avito"]["use_bypass_api"] = False
          data["avito"]["use_own_cookies"] = False
          with open("data/config.toml", "wb") as f:
              tomli_w.dump(data, f)
          print("✅ config.toml: proxy_string = 127.0.0.1:1080")
          PYEOF

      - name: Run parser loop with auto-switch on block
        run: |
          set -u
          END_TIME=$(( $(date +%s) + 19800 ))
          CYCLE_INTERVAL=300
          PARSER_MAX_RUNTIME=270
          BLOCK_THRESHOLD=3   # сколько подряд 403/429/439 до переключения

          CYCLE=0
          BLOCK_COUNT=0

          while [ $(date +%s) -lt $END_TIME ]; do
            CYCLE=$(( CYCLE + 1 ))
            CYCLE_START=$(date +%s)
            CONTAINER_NAME="avito_parser_${GITHUB_RUN_ID}_${CYCLE}"

            echo "═══════════════════════════════════════════════════"
            echo "▶ Цикл #${CYCLE}: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "═══════════════════════════════════════════════════"

            LOG_FILE="data/cycle_${CYCLE}.log"

            timeout --signal=SIGTERM --kill-after=15 $PARSER_MAX_RUNTIME \
              docker run --rm \
                --network host \
                --name "$CONTAINER_NAME" \
                -v "$PWD/data/config.toml:/app/config.toml:ro" \
                -v "$PWD/data/database.db:/app/database.db" \
                -v "$PWD/storage:/app/storage" \
                -v "$PWD/result:/app/result" \
                -v "$PWD/patches/client.py:/app/parser/http/client.py:ro" \
                ghcr.io/avparsolog/parser_avito:latest \
              2>&1 | tee "$LOG_FILE" \
              || echo "⚠️ Проход завершился с кодом $? — продолжаю"

            docker kill "$CONTAINER_NAME" 2>/dev/null || true

            # ─── Проверка на блокировку IP ───
            if grep -q "Доступ ограничен" "$LOG_FILE" 2>/dev/null; then
              BLOCK_COUNT=$(( BLOCK_COUNT + 1 ))
              echo "⚠️ Обнаружена блокировка IP (${BLOCK_COUNT}/${BLOCK_THRESHOLD})"
            else
              BLOCK_COUNT=0
            fi

            # ─── Переключение сервера при блокировке ───
            if [ $BLOCK_COUNT -ge $BLOCK_THRESHOLD ]; then
              echo "🔄 Смена сервера: перезапуск Xray с новым VLESS"
              kill "$(cat data/xray.pid)" 2>/dev/null || true
              sleep 2

              python3 data/pick_vless.py next

              nohup ./xray_bin/xray -c data/xray_config.json > data/xray.log 2>&1 &
              echo $! > data/xray.pid
              sleep 4

              # Проверяем, что новый сервер работает
              if curl -s --max-time 15 -x http://127.0.0.1:1080 https://api.ipify.org >/dev/null; then
                echo "✅ Новый сервер активен"
                BLOCK_COUNT=0
              else
                echo "❌ Новый сервер не работает, пробую следующий"
                # (можно продолжить перебор в цикле)
              fi
            fi

            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            WAIT=$(( CYCLE_INTERVAL - ELAPSED ))
            if [ $WAIT -gt 0 ]; then
              echo "⏱ Пауза ${WAIT}с"
              sleep $WAIT
            fi
          done

      - name: List results
        if: always()
        run: ls -la result/ || true

      - name: Upload Excel + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-results-${{ github.run_id }}
          path: |
            result/
            data/build_log.txt
            data/working_servers.json
            data/test_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Send results to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "⚠️ TG секреты не заданы — пропускаю"
            exit 0
          fi
          shopt -s nullglob
          files=(result/*.xlsx result/*.csv result/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ В result/ нет файлов"
            exit 0
          fi
          if [ ${#files[@]} -eq 1 ]; then
            SEND_FILE="${files[0]}"
          else
            SEND_FILE="avito_results_${RUN_ID}.zip"
            zip -j -q "$SEND_FILE" "${files[@]}"
          fi
          SIZE_MB=$(( $(stat -c%s "$SEND_FILE") / 1024 / 1024 ))
          CAPTION="📊 Avito Parser — run ${RUN_ID} | файлов: ${#files[@]} | размер: ${SIZE_MB} MB"
          IFS=',' read -ra CHATS <<< "$TG_CHAT_ID"
          for CHAT in "${CHATS[@]}"; do
            CHAT="$(echo "$CHAT" | xargs)"
            [ -z "$CHAT" ] && continue
            echo "→ chat_id=${CHAT}"
            HTTP_CODE=$(curl -sS -o /tmp/tg_resp.json -w '%{http_code}' \
              -F "chat_id=${CHAT}" \
              -F "caption=${CAPTION}" \
              -F "document=@${SEND_FILE}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "   ✅ отправлено"
            else
              echo "   ❌ HTTP ${HTTP_CODE}:"; cat /tmp/tg_resp.json || true
            fi
          done
          exit 0

      - name: Stop Xray
        if: always()
        run: |
          if [ -f data/xray.pid ]; then
            kill "$(cat data/xray.pid)" 2>/dev/null || true
            echo "🛑 Xray остановлен"
          fi

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/database.db
            storage/
            data/working_servers.json
            data/current_server_idx
          key: ${{ runner.os }}-parser-state-${{ github.run_id }}

      - name: 🔄 Self-renew
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run parser.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f source=chain
